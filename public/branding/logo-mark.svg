<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- NavYug Official Logo Mark (N + Mountain + Lime Swoosh + Star) -->
  <g id="navyug-logo-mark">
    <!-- Left Vertical Stem & Mountain Base -->
    <path fill="#0F0F0F" d="M 120 400 L 120 140 C 120 120 140 100 160 90 L 175 90 L 175 350 L 220 310 L 250 350 L 290 280 L 330 360 L 370 330 L 400 400 Z" />
    
    <!-- Mountain Silhouette Detail -->
    <path fill="#262626" d="M 200 370 L 240 315 L 275 360 L 315 295 L 360 370 Z" opacity="0.9" />

    <!-- Right Vertical Stem -->
    <path fill="#0F0F0F" d="M 335 110 L 375 110 L 375 360 C 375 390 350 410 320 410 C 270 410 210 370 160 310 L 160 400 L 120 400 C 190 240 270 140 375 110 Z" />
    
    <!-- Arching Swoosh Diagonal -->
    <path fill="url(#lime-gradient)" d="M 165 150 C 220 230 280 320 380 370 C 330 365 270 320 210 250 C 185 220 170 185 165 150 Z" />
    
    <!-- Four-Point Star Spark Accent -->
    <path fill="#B9FF66" d="M 345 180 Q 345 160 360 160 Q 345 160 345 140 Q 345 160 330 160 Q 345 160 345 180 Z" />
  </g>

  <defs>
    <linearGradient id="lime-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9FF73" />
      <stop offset="100%" stop-color="#86D227" />
    </linearGradient>
  </defs>
</svg>
